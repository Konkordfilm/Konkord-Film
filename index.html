<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Konkord Film AS — Kommer snart</title>
  <meta name="description" content="Konkord Film AS – et nytt produksjonsselskap. Kommer snart.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Manrope:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <video class="logo-video" id="logoVideo"
         src="konkord-logo-hvit.mp4"
         poster="konkord-poster.jpg"
         autoplay muted playsinline></video>

  <main class="innhold" id="innhold">
    <h1 class="skjult">Kommer snart.</h1>
    <div class="linje" aria-hidden="true"></div>
    <p class="under skjult">
      Vi bygger noe nytt bak kamera. Legg igjen e-posten din,
      så inviterer vi deg til <strong>premieren</strong>.
    </p>
    <div class="skjult">
      <div class="varsle">
        <input type="email" id="epost" placeholder="din@epost.no" aria-label="E-postadresse">
        <button id="varsleKnapp">Varsle meg</button>
      </div>
      <p class="takk" id="takk">Takk — vi sees på premieren.</p>
    </div>
  </main>

  <footer>Konkord Film AS &middot; Oslo &middot; ETB 2026</footer>

  <script src="script.js"></script>
</body>
</html>
